name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (preinstalled on runner)
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Core module tests
        run: gradle test --console=plain --stacktrace -x :app:test

      - name: Build APKs (full + notification-only)
        run: gradle :app:assembleFullDebug :app:assembleNotifOnlyDebug --console=plain --stacktrace

      - name: App unit tests
        run: gradle :app:testFullDebugUnitTest --console=plain

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ledgerly-debug-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: "**/build/reports/tests/"
